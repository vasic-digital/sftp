# POSITIVE fixture — MUST PASS validation.
# Includes a correctly-acknowledged public account to prove the
# allOf/if/then rule accepts the legal form (public is never default,
# but it IS legal when explicitly acknowledged).
version: 1
accounts:
  - username: sftp_writer
    permission: read_write
    uid: 1002
    gid: 1002
    home: /sftp_data/sftp_writer
    enabled: true
    comment: "Fixture read-write account"
  - username: sftp_reader
    permission: read_only
    uid: 1001
    gid: 1001
    home: /sftp_data/sftp_reader
    enabled: true
  - username: sftp_public
    permission: public
    public_acknowledged: true
    uid: 1003
    gid: 1003
    home: /sftp_data/sftp_public
    enabled: false
    comment: "Fixture public account — legal only with acknowledgement"

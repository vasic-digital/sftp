# Kotlin / Compose Multiplatform
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Gradle
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Compose Multiplatform (resources not used yet, keep off for lean builds)
compose.ios.resources.sync=false

# Default server URL baked into debug builds only; release builds and the
# Settings screen take a runtime value. NEVER a credential (§11.4.10).
SFTP_DEFAULT_SERVER_URL=http://127.0.0.1:7722
